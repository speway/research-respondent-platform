name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

jobs:
  verify:
    name: Lint, typecheck, tests and build
    runs-on: ubuntu-latest
    timeout-minutes: 30
    defaults:
      run:
        working-directory: research-respondent-platform
        shell: bash
    env:
      DATABASE_FILE: ${{ github.workspace }}/research-respondent-platform/data/ci-placeholder.db
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Check out source
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11.7.0
          run_install: false

      - name: Set up Node.js 24
        uses: actions/setup-node@v4
        with:
          node-version: "24"
          cache: pnpm
          cache-dependency-path: research-respondent-platform/pnpm-lock.yaml

      - name: Install locked dependencies
        run: pnpm install --frozen-lockfile

      - name: Verify native SQLite module
        run: node -e "require('better-sqlite3'); console.log('SQLite native binding available')"

      - name: Lint
        run: pnpm run lint

      - name: Typecheck
        run: pnpm run typecheck

      - name: Unit and integration tests
        run: pnpm test

      - name: Production build
        run: pnpm run build

      - name: HTTP smoke suite
        run: pnpm run test:http

      - name: Install isolated browser tooling
        run: |
          npm install --prefix "$RUNNER_TEMP/rrp-browser" --no-save --ignore-scripts playwright@1.62.1
          node "$RUNNER_TEMP/rrp-browser/node_modules/playwright/cli.js" install --with-deps chromium

      - name: Verify browser workbench and agent execution
        run: |
          export PLAYWRIGHT_MODULE="file://$RUNNER_TEMP/rrp-browser/node_modules/playwright/index.mjs"
          node --experimental-strip-types tests/browser/workbench.mjs
          node --experimental-strip-types tests/browser/agent-workbench.mjs
          node --experimental-strip-types tests/browser/agent-controls.mjs
